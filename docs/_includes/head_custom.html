<!-- App icon in the browser tab and on the iPhone Home Screen; browser bar matches Light/Dark -->
<link rel="icon" type="image/png" href="{{ '/assets/images/logo.png' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/assets/images/logo.png' | relative_url }}">
<meta name="apple-mobile-web-app-title" content="User Guide">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<script>
// Android: Google Sans instead of the Apple system font (owner, 2026-10-13)
if (/Android/i.test(navigator.userAgent)) {
  document.documentElement.classList.add("android");
  var gs = document.createElement("link");
  gs.rel = "stylesheet";
  gs.href = "https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap";
  document.head.appendChild(gs);
}
</script>
<script>
// Missing screenshot → grey placeholder with icon, the image's description and a note (owner, 2026-10-12).
(function () {
  var icon = '<svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M21 15.5l-5-5-9 9"/></svg>';
  function swap(img) {
    if (img.dataset.ph || !img.closest('.main-content')) return;
    img.dataset.ph = '1';
    var box = document.createElement('div');
    box.className = 'img-placeholder';
    box.setAttribute('role', 'img');
    box.setAttribute('aria-label', img.alt);
    box.innerHTML = icon + '<div class="ph-desc"></div><div class="ph-note">Image placeholder · Images currently uploading</div>';
    box.querySelector('.ph-desc').textContent = img.alt;
    img.replaceWith(box);
  }
  document.addEventListener('error', function (e) { if (e.target.tagName === 'IMG') swap(e.target); }, true);
  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('.main-content img').forEach(function (img) { if (img.complete && !img.naturalWidth) swap(img); });
  });
})();
</script>
<script>
// Previous / Next links at the bottom of each page, in menu order (owner, 2026-10-12)
document.addEventListener('DOMContentLoaded', function () {
  var links = Array.prototype.slice.call(document.querySelectorAll('.site-nav a.nav-list-link'));
  var i = -1; // last active link = the page itself (a chapter link is also active on its pages)
  for (var j = links.length - 1; j >= 0; j--) if (links[j].classList.contains('active')) { i = j; break; }
  var main = document.querySelector('.main-content');
  if (i < 0 || !main) return;
  var nav = document.createElement('nav');
  nav.className = 'page-nav';
  nav.setAttribute('aria-label', 'Previous and next page');
  [[links[i - 1], 'prev', '\u2039 Previous'], [links[i + 1], 'next', 'Next \u203A']].forEach(function (x) {
    if (!x[0]) return;
    var a = document.createElement('a');
    a.href = x[0].href; a.className = x[1];
    a.innerHTML = '<small>' + x[2] + '</small>';
    a.appendChild(document.createTextNode(x[0].textContent.trim()));
    nav.appendChild(a);
  });
  // before the theme's footer (and its dividing line), so the fine print stays last
  var foot = main.querySelector(':scope > footer');
  var before = foot && foot.previousElementSibling && foot.previousElementSibling.tagName === 'HR' ? foot.previousElementSibling : foot;
  main.insertBefore(nav, before);
});
</script>
{% if page.url == "/" %}
<!-- Tells Google and AI tools what the app is -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "SoftwareApplication",
  "name": "Distribution App",
  "description": {{ site.description | jsonify }},
  "applicationCategory": "BusinessApplication",
  "operatingSystem": "macOS 13 or later, Windows 10 or 11 (64-bit)",
  "downloadUrl": "https://github.com/totoantonio/DistributionApp/releases/latest",
  "image": {{ "/assets/images/logo.png" | absolute_url | jsonify }},
  "author": { "@type": "Person", "name": "totoantonio" }
}
</script>
{% endif %}
